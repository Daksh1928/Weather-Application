<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dashboard">
    <!-- Left Sidebar mimicking the reference image -->
    <aside class="sidebar glass-panel">
      <div class="logo-area">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      
      <div class="sidebar-controls">
        <button id="geoBtn" class="icon-btn glass-button" title="Current Location">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        
        <div class="lang-selector">
          <select id="langSelect" class="glass-button">
            <option value="en" selected>EN</option>
            <option value="hi">HI</option>
            <option value="es">ES</option>
            <option value="fr">FR</option>
          </select>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <!-- Top Bar for Search -->
      <header class="top-bar">
        <div class="user-greeting">
          <p>Weather Forecast</p>
        </div>
        <div class="search-box glass-panel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off" />
          <button id="searchBtn">Search</button>
        </div>
      </header>

      <div id="statusMessage" class="status-message"></div>

      <!-- Main Weather Info Area -->
      <main id="weatherDisplay" class="weather-display hidden">
        
        <div class="weather-left">
          <h1 id="description" class="huge-description">--</h1>
          <div class="forecast-graph">
            <!-- Decorative wave to mimic the reference image -->
            <svg viewBox="0 0 500 100" preserveAspectRatio="none" class="wave-svg">
              <path d="M0,50 C150,100 350,0 500,50 L500,100 L0,100 Z" fill="rgba(255,255,255,0.1)"></path>
              <path d="M0,50 C150,100 350,0 500,50" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"></path>
            </svg>
          </div>
        </div>

        <!-- Right side stacked cards -->
        <div class="weather-right">
          <div class="glass-card main-temp-card">
            <div class="location-header">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
              <h2 id="cityName">--</h2>
            </div>
            <div class="temp-wrapper">
              <h1 id="temperature">--°C</h1>
              <img id="weatherIcon" src="" alt="Condition" />
            </div>
          </div>

          <div class="glass-card metric-card">
            <span class="label" id="labelHumidity">Humidity</span>
            <span class="value" id="humidity">--%</span>
          </div>

          <div class="glass-card metric-card">
            <span class="label" id="labelWind">Wind Speed</span>
            <span class="value" id="windSpeed">-- m/s</span>
          </div>
          
          <div class="glass-card metric-card">
            <span class="label" id="labelFeelsLike">Feels Like</span>
            <span class="value" id="feelsLike">--°C</span>
          </div>

          <div class="glass-card metric-card">
            <span class="label" id="labelPressure">Pressure</span>
            <span class="value" id="pressure">-- hPa</span>
          </div>
        </div>

      </main>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
